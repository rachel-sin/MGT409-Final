<svg width="100%" viewBox="0 0 760 1040" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Discover then verify flow, with caching and code-level safety backstops</title>
<desc>A neighborhood/cuisine filter (or a restaurant name, which skips discovery via a "did you mean X?" confirm step) feeds the Finder agent, which discovers candidates via broad web search rather than scraping a single curated directory. A 24-hour cache can short-circuit a repeated discovery search. For each candidate, a 30-day per-restaurant cache can skip straight to a previously-verified result. Otherwise, the restaurant's own menu is checked first for a gluten-free marking; if none is found, aggregator and review sites are checked as a fallback. Both paths produce evidence claims, which flow through the Skeptic, then the Ranker, then code-level safety backstops (the asymmetric-risk override and the dedicated-prep recency rule, re-checked independently of the model) and an absolutist-language scanner, before results are sorted best-evidence-first. A legend at the bottom explains the color coding: gray for data, purple for discovery, teal for verification, coral for review, pink for the final decision.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .tn { font-size: 11px; font-style: italic; fill: #6b6153; }
  .box { fill: #F1EFE8; stroke: #888780; stroke-width: 0.5; }
  .c-gray { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-purple { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th, .c-purple .ts { fill: #26215C; }
  .c-teal { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th, .c-teal .ts { fill: #04342C; }
  .c-coral { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th, .c-coral .ts { fill: #4A1B0C; }
  .c-pink { fill: #FBEAF0; stroke: #993556; }
  .c-pink .th, .c-pink .ts { fill: #4B1528; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .arr-dash { stroke: #5F5E5A; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
</style>

<g class="c-gray">
  <rect x="190" y="30" width="300" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="52" text-anchor="middle">Neighborhood / cuisine filter</text>
  <text class="tn" x="340" y="68" text-anchor="middle">(a restaurant name instead skips to a "did you mean X?" confirm step, then joins below)</text>
</g>
<line x1="340" y1="82" x2="340" y2="110" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
  <rect x="190" y="110" width="300" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="132" text-anchor="middle">Finder</text>
  <text class="ts" x="340" y="150" text-anchor="middle">Broad web search by area/cuisine</text>
</g>
<text class="tn" x="500" y="140">24h cache for a repeated search;</text>
<text class="tn" x="500" y="154">"Show more" re-asks excluding shown names</text>
<line x1="340" y1="162" x2="340" y2="196" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
  <polygon points="340,196 460,233 340,270 220,233" stroke-width="0.5"/>
  <text class="th" x="340" y="228" text-anchor="middle">Restaurant already</text>
  <text class="th" x="340" y="244" text-anchor="middle">cached? (30 days)</text>
</g>
<line x1="340" y1="270" x2="340" y2="300" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="290">No</text>
<path d="M460 233 L620 233 L620 860 L500 860" class="arr-dash" marker-end="url(#arrow)"/>
<text class="ts" x="625" y="222">Yes</text>
<text class="tn" x="560" y="850">skip straight to the</text>
<text class="tn" x="560" y="864">verified result — 0 new tokens</text>

<g class="c-teal">
  <rect x="200" y="300" width="280" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="322" text-anchor="middle">Evidence extractor</text>
  <text class="ts" x="340" y="340" text-anchor="middle">Checks restaurant's own menu</text>
</g>
<line x1="340" y1="352" x2="340" y2="386" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
  <polygon points="340,386 450,421 340,456 230,421" stroke-width="0.5"/>
  <text class="th" x="340" y="426" text-anchor="middle">GF marked on menu?</text>
</g>

<line x1="340" y1="456" x2="340" y2="490" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="480">No</text>

<path d="M450 421 L560 421 L560 572 L490 572" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="565" y="410">Yes</text>

<g class="c-teal">
  <rect x="200" y="490" width="280" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="512" text-anchor="middle">Evidence extractor</text>
  <text class="ts" x="340" y="530" text-anchor="middle">Falls back to reviews / aggregators</text>
</g>
<line x1="340" y1="542" x2="340" y2="576" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
  <rect x="210" y="576" width="260" height="48" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="596" text-anchor="middle">Evidence claims</text>
  <text class="ts" x="340" y="612" text-anchor="middle">Quote + source URL, re-verified</text>
</g>
<line x1="340" y1="624" x2="340" y2="652" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
  <rect x="210" y="652" width="260" height="48" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="672" text-anchor="middle">Skeptic</text>
  <text class="ts" x="340" y="688" text-anchor="middle">Flags promotional or contradicted</text>
</g>
<line x1="340" y1="700" x2="340" y2="728" class="arr" marker-end="url(#arrow)"/>

<g class="c-pink">
  <rect x="210" y="728" width="260" height="48" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="748" text-anchor="middle">Ranker</text>
  <text class="ts" x="340" y="764" text-anchor="middle">Safety tier + confidence</text>
</g>
<line x1="340" y1="776" x2="340" y2="804" class="arr" marker-end="url(#arrow)"/>

<g class="c-pink">
  <rect x="190" y="804" width="300" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="824" text-anchor="middle">Code-level safety backstops</text>
  <text class="ts" x="340" y="842" text-anchor="middle">Illness-override + recency rule, re-checked;</text>
  <text class="ts" x="340" y="856" text-anchor="middle">absolutist-language scanner</text>
</g>
<line x1="340" y1="860" x2="340" y2="888" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="860" x2="500" y2="888" class="arr-dash"/>
<line x1="500" y1="888" x2="340" y2="888" class="arr-dash" marker-end="url(#arrow)"/>

<g class="c-gray">
  <rect x="190" y="896" width="300" height="48" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="916" text-anchor="middle">Final safety assessment</text>
  <text class="ts" x="340" y="932" text-anchor="middle">Results shown best-evidence-first</text>
</g>

<circle cx="172" cy="990" r="4" fill="#5F5E5A"/>
<text class="ts" x="180" y="994">Data</text>
<circle cx="228" cy="990" r="4" fill="#534AB7"/>
<text class="ts" x="236" y="994">Discover</text>
<circle cx="312" cy="990" r="4" fill="#0F6E56"/>
<text class="ts" x="320" y="994">Verify</text>
<circle cx="382" cy="990" r="4" fill="#993C1D"/>
<text class="ts" x="390" y="994">Review</text>
<circle cx="452" cy="990" r="4" fill="#993556"/>
<text class="ts" x="460" y="994">Decision</text>
<text class="tn" x="172" y="1020">Dashed lines: cache shortcut (top) and code-level backstop path (bottom) — both skip costly live agent calls.</text>
</svg>
